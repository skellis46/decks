<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Losing Oneself · C-DaRE</title>

  <!--
    All slide content lives in slides.md — edit that file and refresh.
    TO RUN: python3 -m http.server → http://localhost:8000
  -->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/black.css" id="theme">

  <style>
    :root {
      --cov-blue:   #0074E7;
      --cov-purple: #2B1C43;
      --cov-mid:    #5B289F;
      --cov-white:  #FFFFFF;

      /* dialled down from the black-theme defaults (2.5em / 1.6em) */
      --r-heading1-size: 2.1em;
      --r-heading2-size: 1.35em;
    }

    #cov-wordmark {
      position: fixed; top: 16px; right: 24px;
      z-index: 100; pointer-events: none;
    }
    #cov-wordmark img { height: 40px; display: block; }

    .reveal h1 { color: var(--cov-white); font-size: 2.1em; }
    .reveal h2 { color: var(--cov-white); font-size: 1.4em; }
    .reveal h3 {
      color: var(--cov-blue);
      font-size: 0.7em; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 0.15em;
    }

    /* extra breathing room above this slide's title */
    .reveal h2.pushed-down { margin-top: 2.5em; }

    /* diagram slide title: smaller + a bit more space above, so the
       diagram below it has room to breathe at both top and bottom */
    .reveal h2.dft-title { font-size: 1.05em; margin-top: 1em; margin-bottom: 0.4em; }

    /* references slide: small text, left-aligned, holds the full list */
    .refs {
      text-align: left;
      max-width: 860px;
      margin: 1.2em auto 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .refs p { margin: 0 0 0.7em; color: rgba(255,255,255,.85); }
    .refs em { font-style: italic; color: var(--cov-white); }

    /* five-positions slides: paraphrase/quote on the left, a portrait
       (or logo, for ELIA — an organisation, not a person) on the right */
    .position-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.2em;
      max-width: 820px;
      margin: 0.6em auto 0;
      text-align: left;
    }
    .position-text { flex: 1 1 auto; min-width: 0; }
    .position-text h3 { margin-top: 0; }
    .position-text p { margin: 0; }
    .position-text blockquote { width: 100%; margin: 0; text-align: left; }
    .position-photo {
      flex: 0 0 150px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.05);
    }
    /* !important here: reveal.css's own "html:not(.print-pdf) .reveal
       section img" rule outranks a plain .position-photo img selector
       on specificity and was forcing its 15px margin / #fff background /
       1px #666 border onto these — the visible "edge" — and the theme's
       max-width/max-height:95% cap was leaving a further gap uncovered */
    .position-photo img {
      width: 100% !important; height: 100% !important;
      max-width: none !important; max-height: none !important;
      object-fit: cover; display: block;
      margin: 0 !important; border: 0 !important;
      background: transparent !important; box-shadow: none !important;
      box-sizing: border-box;
    }
    /* ELIA's mark is a logo, not a portrait — light card, cropped in
       close (cover, not contain) so the mark reads at this size, with
       a bit of extra zoom since cover alone still read a touch small */
    .position-photo.is-logo {
      border-radius: 10px;
      background: #fff;
      padding: 4px;
      box-sizing: border-box;
    }
    .position-photo.is-logo img { object-fit: cover; transform: scale(1.1); }
    /* narrow window: stack photo below text rather than squeezing both */
    @media (max-width: 700px) {
      .position-row { flex-direction: column; text-align: center; }
      .position-text { text-align: center; }
      .position-text blockquote { text-align: center; }
    }

    /* Divergent trajectories diagram: box/arrow layout is defined once
       in JS below and rendered per-slide at whatever stage that slide's
       .dft-frame[data-stage] names — replaces the old single-slide,
       click-through fragment build. */
    .dft-frame{position:relative;width:940px;height:470px;margin:0 auto;}
    .dft-frame .dft-box{
      position:absolute;box-sizing:border-box;
      display:flex;align-items:center;justify-content:center;text-align:center;
      border-radius:8px;padding:8px 16px;color:#fff;line-height:1.25;
    }
    .dft-frame .dft-box.root{
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.4);
      font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:19px;
    }
    .dft-frame .dft-box.step{
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);
      font-size:16px;
    }
    .dft-frame .dft-box.terminal{
      background:linear-gradient(135deg,#0a5fb8,#5B289F);border:1px solid transparent;
      font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:18px;
    }
    /* the stage just introduced on this slide gets a highlight ring */
    .dft-frame .dft-box.current{
      box-shadow:0 0 0 2px var(--cov-blue), 0 0 20px rgba(0,116,231,.5);
    }
    .dft-frame svg.dft-arrow{position:absolute;overflow:visible;}

    /* title-slide byline: presenter name, right-aligned below the subtitle */
    .title-byline {
      margin-top: 2.4em;
      padding-right: 0.8em;
      text-align: right;
      color: var(--cov-white);
      font-size: 0.5em; font-weight: 400;
      text-transform: none; letter-spacing: 0.01em;
    }

    /* looser, less dense bullet lists */
    .reveal .slides ul,
    .reveal .slides ol { line-height: 1.3; }
    .reveal .slides ul > li,
    .reveal .slides ol > li { margin: 0.55em 0; }

    /* video embeds: click-to-play-fullscreen overlay */
    .video-embed {
      position: relative;
      width: 560px;
      max-width: 90%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }
    .video-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-embed iframe:fullscreen,
    .video-embed iframe:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
    }
    /* invisible click-catcher — the video platform already shows its own
       play icon on the thumbnail, so this just adds the autoplay+fullscreen
       behaviour without drawing a second button on top of it */
    .video-fullscreen-btn {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="cov-wordmark">
    <img src="cov-logo.png" alt="C-DaRE · Coventry University">
  </div>

  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md"
               data-separator="\r?\n---\r?\n"
               data-separator-vertical="\r?\n----\r?\n"
               data-separator-notes="^Note:">
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/highlight/highlight.js"></script>

  <script>
    /* ----------------------------------------------------------------
       Speaker-view tweaks (default layout):
         - shrink the current-slide column
         - enlarge the notes text
       The notes plugin is loaded from the CDN, so its speaker-view.html
       can't be edited directly. Instead we catch the speaker window when
       it opens and inject a small style override once it has rendered.
       Adjust the two values marked TWEAK below.
    ---------------------------------------------------------------------- */
    (function () {
      var SPEAKER_CSS =
        '#current-slide { width: 42% !important; }' +              /* TWEAK: slide width */
        '#upcoming-slide { width: 58% !important; left: 42% !important; right: auto !important; height: 28% !important; }' +  /* TWEAK: upcoming height */
        '#speaker-controls { width: 58% !important; left: 42% !important; right: auto !important; top: 28% !important; height: 72% !important; }' +
        '.speaker-controls-notes .value { font-size: 30px !important; line-height: 1.5 !important; }'; /* TWEAK: notes text size */

      var nativeOpen = window.open;
      window.open = function () {
        var win = nativeOpen.apply(window, arguments);
        if (!win) return win;
        var tries = 0;
        var iv = setInterval(function () {
          tries++;
          try {
            var doc = win.document;
            // Only touch reveal's speaker view, and only once it has rendered.
            if (doc && doc.querySelector('.speaker-controls-notes') &&
                !doc.getElementById('cov-speaker-overrides')) {
              var s = doc.createElement('style');
              s.id = 'cov-speaker-overrides';
              s.textContent = SPEAKER_CSS;
              doc.head.appendChild(s);
              clearInterval(iv);
            }
          } catch (e) { /* not ready yet — ignore and retry */ }
          if (win.closed || tries > 100) clearInterval(iv);  // ~30s safety net
        }, 300);
        return win;
      };
    })();

    Reveal.initialize({
      hash: true,
      plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
    }).then(function () {

      // Reveal each piece of content one click at a time.
      // Titles, subtitles and blockquotes (h1/h2/h3/blockquote) stay visible
      // on arrival; paragraphs, code and list items all fragment in.
      document.querySelectorAll('.reveal .slides section').forEach(function (section) {
        // skip the container of a vertical stack
        if (section.querySelector(':scope > section')) return;
        // leave any custom animated slide (data-step) untouched
        if (section.hasAttribute('data-step') || section.querySelector('[data-step]')) return;

        Array.prototype.forEach.call(section.children, function (el) {
          if (el.matches('aside.notes')) return;        // speaker notes
          if (el.matches('h1, h2, h3, blockquote')) return;  // keep title + subtitle + quote visible
          if (el.matches('ul, ol')) {
            el.querySelectorAll('li').forEach(function (li) {
              li.classList.add('fragment', 'fade-up');
            });
          } else if (el.matches('h4, p, pre')) {
            el.classList.add('fragment', 'fade-up');     // stray sub-content
          }
        });
      });
      Reveal.sync();

      // ---- Divergent trajectories diagram: stage-aware renderer ----
      // Single source of truth for box/arrow layout (was previously
      // hand-duplicated fragment HTML inlined in slides.md for one slide;
      // now driven by each .dft-frame's data-stage so the same definition
      // renders across the many stage/detail slides in slides.md).
      var DFT_ROOT_BOX = { left:380, top:13, width:180, height:43, cls:'root', text:'Practice' };
      var DFT_ROOT_ARROW = { left:466, top:56, width:8, height:38, x1:4, y1:0, x2:4, y2:38 };
      // Right leg first (per talk order, now 4 stages), then left leg (5 stages).
      var DFT_STAGES = [
        null, // 1-indexed to match data-stage
        { arrow:{left:470, top:94,  width:235, height:34, x1:0, y1:0, x2:235, y2:34},
          box:{left:570, top:128, width:270, height:43, cls:'step', text:'audiovisual recordings'} },
        { arrow:{left:703, top:171, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:570, top:198, width:270, height:43, cls:'step', text:'post-production concept'} },
        { arrow:{left:703, top:241, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:570, top:268, width:270, height:43, cls:'step', text:'editing'} },
        { arrow:{left:703, top:311, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:570, top:338, width:270, height:43, cls:'terminal', text:'output (shimmer)'} },
        { arrow:{left:235, top:94,  width:235, height:34, x1:235, y1:0, x2:0, y2:34},
          box:{left:100, top:128, width:270, height:43, cls:'step', text:'experiential/discursive'} },
        { arrow:{left:233, top:171, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:100, top:198, width:270, height:43, cls:'step', text:'conversations + interviews'} },
        { arrow:{left:233, top:241, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:100, top:268, width:270, height:43, cls:'step', text:'transcription'} },
        { arrow:{left:233, top:311, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:100, top:338, width:270, height:43, cls:'step', text:'thematic/search analysis'} },
        { arrow:{left:233, top:381, width:4, height:27, x1:2, y1:0, x2:2, y2:27},
          box:{left:100, top:408, width:270, height:43, cls:'terminal', text:'Chapter'} }
      ];

      function dftBoxHTML(box, extraCls) {
        var cls = 'dft-box ' + box.cls + (extraCls ? ' ' + extraCls : '');
        return '<div class="' + cls + '" style="left:' + box.left + 'px;top:' + box.top +
               'px;width:' + box.width + 'px;height:' + box.height + 'px;">' + box.text + '</div>';
      }
      function dftArrowHTML(arrow) {
        return '<svg class="dft-arrow" style="left:' + arrow.left + 'px;top:' + arrow.top + 'px;" ' +
               'width="' + arrow.width + '" height="' + arrow.height + '">' +
               '<line x1="' + arrow.x1 + '" y1="' + arrow.y1 + '" x2="' + arrow.x2 + '" y2="' + arrow.y2 + '" ' +
               'stroke="rgba(255,255,255,.55)" stroke-width="2" marker-end="url(#dft-arrowhead)"/></svg>';
      }
      function renderDFT(frame) {
        var stage = parseInt(frame.getAttribute('data-stage'), 10) || 0;
        var html = dftArrowHTML(DFT_ROOT_ARROW) + dftBoxHTML(DFT_ROOT_BOX);
        for (var i = 1; i <= stage; i++) {
          var s = DFT_STAGES[i];
          if (!s) continue;
          html += dftArrowHTML(s.arrow) + dftBoxHTML(s.box, i === stage ? 'current' : '');
        }
        frame.innerHTML = html;
      }

      // one shared arrowhead marker (SVG marker refs resolve by id
      // document-wide), reused by every .dft-frame instance
      if (!document.getElementById('dft-arrowhead-defs')) {
        var dftDefs = document.createElement('div');
        dftDefs.id = 'dft-arrowhead-defs';
        dftDefs.innerHTML =
          '<svg width="0" height="0" style="position:absolute">' +
          '<defs><marker id="dft-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
          '<path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,.55)"></path></marker></defs></svg>';
        document.body.appendChild(dftDefs);
      }
      document.querySelectorAll('.dft-frame').forEach(renderDFT);

      // Video embeds: one click starts playback (autoplay=1) AND requests
      // fullscreen on the iframe element itself, since this is a genuine
      // user-gesture click on our own page (not something inside the
      // cross-origin iframe, where autoplay+fullscreen would be blocked).
      // PeerTube (exquisite.tube) embeds default to auto quality, which
      // can start low and step up. Force 1080p (or the best available,
      // if 1080p wasn't transcoded) via the PeerTube embed API rather
      // than relying on manually picking it from the quality menu —
      // requires the iframe's src to carry ?api=1 (see slides.md).
      var PEERTUBE_API_SRC = 'https://unpkg.com/@peertube/embed-api/build/player.min.js';
      var peertubeApiLoading = null;
      function loadPeerTubeApi() {
        if (window.PeerTubePlayer) return Promise.resolve();
        if (peertubeApiLoading) return peertubeApiLoading;
        peertubeApiLoading = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = PEERTUBE_API_SRC;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        return peertubeApiLoading;
      }
      function force1080p(iframe) {
        loadPeerTubeApi().then(function () {
          var player = new window.PeerTubePlayer(iframe);
          return player.ready.then(function () { return player.getResolutions(); })
            .then(function (resolutions) {
              var target = resolutions.filter(function (r) { return String(r.height) === '1080'; })[0];
              if (!target) {
                // 1080p wasn't transcoded for this video — use whatever's highest
                target = resolutions.reduce(function (best, r) {
                  return (!best || Number(r.height) > Number(best.height)) ? r : best;
                }, null);
              }
              if (target) return player.setResolution(target.id);
            });
        }).catch(function () { /* non-fatal — video still plays, just at default quality */ });
      }

      document.querySelectorAll('.video-fullscreen-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var iframe = document.getElementById(btn.dataset.target);
          if (!iframe) return;
          var src = iframe.getAttribute('src');
          if (src.indexOf('autoplay=1') === -1) {
            src += (src.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1';
            iframe.setAttribute('src', src);
          }
          var request = iframe.requestFullscreen || iframe.webkitRequestFullscreen ||
                        iframe.mozRequestFullScreen || iframe.msRequestFullscreen;
          if (request) request.call(iframe);
          btn.style.display = 'none';
          if (src.indexOf('exquisite.tube') > -1) force1080p(iframe);
        });
      });

      // Once the iframe has focus (from clicking play / using its controls),
      // arrow-key presses go to the video's own document and never reach
      // Reveal's keyboard handler — even after exiting fullscreen. Hand
      // focus back to the top-level page whenever fullscreen ends or the
      // slide changes, so left/right arrow navigation keeps working.
      function releaseVideoFocus() {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
          document.activeElement.blur();
        }
      }
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
        .forEach(function (evt) {
          document.addEventListener(evt, function () {
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                       document.mozFullScreenElement || document.msFullscreenElement;
            if (!fsEl) releaseVideoFocus();
          });
        });
      Reveal.on('slidechanged', releaseVideoFocus);

      // Safety net: the C-DaRE wordmark is pinned to the real viewport
      // (position: fixed), so it doesn't scale down with the presentation.
      // On short/narrow windows a vertically-centred slide can end up
      // close to that corner. Never let a slide's content render above a
      // safe minimum offset from the top of the slide.
      var MIN_SLIDE_TOP = 70; // in Reveal's internal 960x700 units
      function clampSlideTops() {
        document.querySelectorAll('.reveal .slides section').forEach(function (sec) {
          if (sec.classList.contains('stack')) return;
          var top = parseFloat(sec.style.top);
          if (!isNaN(top) && top < MIN_SLIDE_TOP) {
            sec.style.top = MIN_SLIDE_TOP + 'px';
          }
        });
      }
      Reveal.on('slidechanged', function () { setTimeout(clampSlideTops, 30); });
      window.addEventListener('resize', function () { setTimeout(clampSlideTops, 60); });
      setTimeout(clampSlideTops, 50);

    });
  </script>
</body>
</html>
